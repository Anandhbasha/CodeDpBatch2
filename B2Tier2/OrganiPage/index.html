<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class = "loginContainer">
        <div class="leftImage">
            <img src="https://img.magnific.com/free-photo/healthy-food-organic-fresh-farmer-products_53876-64953.jpg?semt=ais_hybrid&w=740&q=80" alt="Organic Store">
            <div class="storeContent">
                <h1>Organic Store</h1>
                <p>Fresh.Natural.Healty.</p>
            </div>
        </div>
        <div class = "rightSection">
            <div class="loginForm">
                <h1>Welcome Back</h1>
                <p>Login to Your Account</p>
                <div class="inputBox">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>
                <div class="inputBox">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
            </div>
            <div class="option">
                <label for="remember">
                    <input type="checkbox" id="remember"> Remember Me
                </label>
                <a href="#">Forgot Password?</a>
            </div>
            <button class="loginButton">Login</button>
            <p class="signupLink">Don't have an account? <a href="#">Sign Up
        </div>
    </div>
</body>
</html>
