<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav class="navBar">
            <section class="logo">
                <i class="fa-solid fa-mug-hot"></i> 
                <h2>Coffee</h2>
            </section>
            <section class="navLinks">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Menus</a>
                <a href="#">Our areas</a>
                <a href="#">Contact</a>
            </section>
        </nav>
        <div class="homePage">
            <section class="leftPage">
                <h1>Best Coffee</h1>
                <h2>Make your day great with our <br> Special Coffee</h2>
                <p>Coffee is a popular global beverage brewed from the roasted and ground seeds of the tropical evergreen coffee plant</p>
                <div class="btmButton">
                    <button class="active">OrderNow</button>
                    <button class="sub">Contact</button>
                </div>
            </section>
            <section class="rightPage">
                <div class="images">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT74PlcdRTl6AsESCwB3Q9Vi6e8J0DNNizFz4Oio5Qv3A&s=10">

        </div>

</html>
